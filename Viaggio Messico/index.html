<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlante Definitivo - Messico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-amber-50 to-emerald-50 min-h-screen text-gray-800 font-sans p-4 sm:p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Header Dinamico -->
        <header class="text-center mb-6">
            <span id="trip-dates" class="bg-amber-200 text-amber-900 text-xs font-bold uppercase px-3 py-1 rounded-full tracking-wider"></span>
            <h1 id="trip-title" class="text-3xl sm:text-4xl font-extrabold text-emerald-900 mt-2"></h1>
            <p id="trip-subtitle" class="text-gray-600 mt-1"></p>
            <!-- Pulsante Voli -->
            <div class="mt-5 flex justify-center">
                <button onclick="toggleFlightModal()" class="inline-flex items-center gap-2 px-6 py-2.5 bg-slate-900 text-white text-sm font-extrabold rounded-full shadow-xl hover:bg-slate-800 transition-all hover:-translate-y-0.5 hover:shadow-slate-400/50">
                    ✈️ Dettagli Voli
                </button>
            </div>
        </header>

        <!-- Navigazione Dinamica -->
        <div id="nav-container" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6">
            <!-- I bottoni verranno generati dal JS -->
        </div>

        <!-- Layout Principale -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- COLONNA SINISTRA: Mappa Interattiva -->
            <div class="lg:col-span-5 bg-white p-4 rounded-2xl shadow-xl border border-gray-100 flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold text-emerald-900 uppercase tracking-wide">Mappa Geografica</h2>
                    <span class="text-[11px] text-gray-400">Clicca sui pin rossi</span>
                </div>
                <div id="map" class="rounded-xl shadow-inner z-10"></div>
                <div class="mt-3 text-xs text-emerald-800 bg-emerald-50 p-2.5 rounded-lg text-center">
                    💡 <strong>Sincronizzata:</strong> Cliccando sui pin o sui tab la mappa si sposta automaticamente.
                </div>
            </div>

            <!-- COLONNA DESTRA: Contenuti Dinamici -->
            <div class="lg:col-span-7 bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 flex flex-col justify-between">
                
                <!-- Contenitore per le schede settimanali -->
                <div id="content-container">
                    <!-- Il contenuto delle settimane verrà generato dal JS -->
                </div>

                <!-- Footer comune della scheda -->
                <div class="px-6 py-3 bg-gray-50 border-t border-gray-100 flex justify-between items-center text-xs text-gray-500 mt-4">
                    <span id="footer-trip-name"></span>
                    <span id="footer-trip-season" class="font-bold text-emerald-700"></span>
                </div>
            </div>

        </div>
    </div>

    <!-- Dati e Logica -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

    <!-- Contenitore Modale Voli (Dinamico) -->
    <div id="flight-modal-container"></div>
</body>
</html>
