<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Giorno</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS per la Mappa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
        /* Stile specifico per la mappa del dettaglio */
        #map-detail { height: 350px; width: 100%; border-radius: 0.75rem; z-index: 10; }
    </style>
</head>
<body class="bg-gray-50 font-sans p-4 sm:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <!-- Bottone Indietro -->
        <div class="p-4 border-b border-gray-100 bg-emerald-50">
            <a href="index.html" class="text-emerald-700 text-sm font-bold hover:underline flex items-center gap-1">
                <span>←</span> Torna all'Itinerario
            </a>
        </div>

        <div class="p-6 sm:p-8" id="day-content">
            <!-- Contenuto in attesa di JS -->
            <p class="text-gray-500">Caricamento dettagli...</p>
        </div>
    </div>

    <!-- Dati e Logica -->
    <script src="js/data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dayId = urlParams.get('day');

        let selectedDay = null;
        tripData.weeks.forEach(week => {
            if (week.days) {
                const found = week.days.find(d => d.id === dayId);
                if (found) selectedDay = found;
            }
        });

        if (selectedDay) {
            const container = document.getElementById('day-content');
            
            // Genera Immagini
            const imagesHtml = (selectedDay.images || []).map(img => 
                `<img src="${img}" class="w-full h-48 sm:h-64 object-cover rounded-xl shadow-sm mb-4">`
            ).join('');

            // Genera Link
            const linksHtml = (selectedDay.links || []).map(link => 
                `<a href="${link.url}" target="_blank" class="inline-block bg-emerald-100 text-emerald-800 px-4 py-2 rounded-lg text-sm font-bold hover:bg-emerald-200 transition mb-2 mr-2">${link.text}</a>`
            ).join('');

            // Struttura Base HTML
            container.innerHTML = `
                <div class="flex items-center gap-3 mb-4">
                    <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full uppercase">${selectedDay.dayName}</span>
                    <span class="text-gray-400 text-sm font-medium">📍 ${selectedDay.location}</span>
                </div>
                <h1 class="text-3xl font-extrabold text-gray-900 mb-6">${selectedDay.title}</h1>
                
                ${imagesHtml}

                <h3 class="text-xl font-bold text-gray-800 mt-6 mb-2">Programma della giornata</h3>
                <p class="text-gray-600 leading-relaxed mb-8">${selectedDay.fullDesc}</p>
                
                <!-- MAPPA -->
                <h3 class="text-xl font-bold text-gray-800 mb-3">Itinerario su Mappa</h3>
                <div id="map-detail" class="mb-8 border border-gray-200 shadow-inner"></div>
                
                <h3 class="text-xl font-bold text-gray-800 mb-3">Risorse Utili</h3>
                <div class="flex flex-wrap">
                    ${linksHtml}
                </div>
            `;

            // INIZIALIZZAZIONE MAPPA DETTAGLIO
            if (selectedDay.route && selectedDay.route.length > 0) {
                const mapDetail = L.map('map-detail');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 18,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(mapDetail);

                const latlngs = [];
                
                // Crea i pin con le immagini
                selectedDay.route.forEach((stop, index) => {
                    const marker = L.marker(stop.coords).addTo(mapDetail);
                    
                    let popupContent = `<div class="text-center font-sans">`;
                    popupContent += `<b class="block text-emerald-800 mb-1 text-sm">${index + 1}. ${stop.name}</b>`;
                    
                    if (stop.image) {
                        // MODIFICA 1: Cambiato h-24 (96px) in h-40 (160px) per aumentare l'altezza
                        popupContent += `<img src="${stop.image}" alt="${stop.name}" class="w-full h-40 object-cover rounded mt-2 shadow-md">`;
                    }
                    
                    popupContent += `</div>`;

                    // MODIFICA 2: Aumentato il minWidth da 160 a 240 per rendere il fumetto più largo
                    marker.bindPopup(popupContent, { minWidth: 240 });
                    latlngs.push(stop.coords);
                });

                // Disegna la linea se c'è più di un punto
                if (latlngs.length > 1) {
                    L.polyline(latlngs, {
                        color: '#10b981', // Verde smeraldo
                        weight: 4, 
                        dashArray: '5, 10' // Linea tratteggiata
                    }).addTo(mapDetail);
                }
                
                // Centra la mappa su tutti i punti con un po' di margine (padding)
                mapDetail.fitBounds(L.latLngBounds(latlngs), {padding: [30, 30]});
            } else {
                // Nascondi la mappa se non ci sono coordinate
                document.getElementById('map-detail').style.display = 'none';
                document.getElementById('map-detail').previousElementSibling.style.display = 'none';
            }
        }
    </script>
</body>
</html>
