<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50/40 to-rose-50/50 min-h-screen text-gray-800 font-sans p-4 sm:p-6 relative overflow-x-hidden">

    <!-- CANVAS PER I FIORI -->
    <canvas id="cempasuchil-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0 opacity-60"></canvas>

    <div class="max-w-7xl mx-auto relative z-10">
        
        <header class="relative z-10 text-center mb-6 mt-3 px-4">

    <div class="max-w-4xl mx-auto">

        <!-- DATA -->
        <div class="flex items-center justify-center gap-3 mb-2">
            <span class="h-px w-8 sm:w-14 bg-orange-500/40"></span>

            <span
                id="trip-dates"
                class="
                    text-[9px] sm:text-[10px]
                    font-black
                    uppercase
                    tracking-[0.28em]
                    text-orange-700/75
                    whitespace-nowrap
                ">
            </span>

            <span class="h-px w-8 sm:w-14 bg-orange-500/40"></span>
        </div>


        <!-- TITOLO -->
        <h1
            id="trip-title"
            class="
                text-4xl
                sm:text-6xl
                lg:text-7xl
                font-black
                tracking-[-0.045em]
                leading-[0.9]
                text-transparent
                bg-clip-text
                bg-gradient-to-r
                from-orange-600
                via-red-500
                to-pink-500
            ">
        </h1>


        <!-- SOTTOTITOLO -->
        <p
            id="trip-subtitle"
            class="
                mt-2
                text-[11px]
                sm:text-xs
                font-medium
                tracking-wide
                text-gray-700/65
            ">
        </p>


        <!-- DETTAGLI VOLI -->
        <div class="mt-3 flex justify-center">
            <button
                onclick="toggleFlightModal()"
                class="
                    group
                    inline-flex
                    items-center
                    gap-2
                    px-4
                    py-1.5
                    rounded-full
                    border
                    border-orange-400/35
                    bg-white/35
                    text-orange-700
                    text-[10px]
                    font-bold
                    tracking-wide
                    shadow-sm
                    transition-all
                    duration-300
                    hover:bg-white/60
                    hover:border-orange-500/50
                    hover:-translate-y-0.5
                ">
                <span class="text-[11px] transition-transform duration-300 group-hover:-translate-y-0.5">
                    ✈
                </span>
                <span>Dettagli voli</span>
            </button>
        </div>


        <!-- FIRMA GRAFICA -->
        <div class="mt-4 flex items-center justify-center gap-2">
            <span class="h-px w-12 bg-gradient-to-r from-transparent to-orange-500/45"></span>

            <span class="text-orange-600/55 text-[9px]">
                ✽
            </span>

            <span class="h-px w-12 bg-gradient-to-l from-transparent to-orange-500/45"></span>
        </div>

    </div>

</header>

        <!-- Navigazione Dinamica -->
        <div id="nav-container" class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-8">
            <!-- I bottoni verranno generati dal JS -->
        </div>

        <!-- HERO FOTOGRAFICA EDITORIALE -->
        <div class="mb-8 relative w-full group">

            <div class="
                relative overflow-hidden
                h-[210px] sm:h-[230px] lg:h-[255px]
                rounded-[1.75rem]
                border border-white/40
                shadow-[0_12px_35px_rgba(80,45,20,0.12)]
                bg-black
            ">

                <img
                    id="dynamic-area-image"
                    src=""
                    alt="Scorcio Messico"
                    class="
                        absolute inset-0
                        w-full h-full
                        object-cover
                        transition-all duration-700
                        group-hover:scale-[1.015]
                    "
                >

                <!-- Overlay -->
                <div class="
                    absolute inset-0
                    bg-gradient-to-t
                    from-black/80
                    via-black/25
                    to-black/5
                "></div>

                <!-- Decorazione messicana discreta -->
                <div class="
                    absolute top-5 right-6
                    text-orange-300/45
                    text-2xl
                    leading-none
                    rotate-12
                    pointer-events-none
                ">✽</div>

                <div class="
                    absolute top-8 right-9
                    w-7 h-px
                    bg-orange-300/30
                    rotate-45
                    pointer-events-none
                "></div>

                <!-- Contenuto dinamico -->
                <div
                    id="dynamic-area-text"
                    class="
                        absolute inset-x-0 bottom-0
                        px-6 py-6
                        sm:px-8 sm:py-7
                        lg:px-10 lg:py-8
                        transition-opacity duration-500
                    "
                >
                    <!-- Contenuto iniettato -->
                </div>

                <!-- Linea decorativa -->
                <div class="
                    absolute bottom-0 left-1/2
                    -translate-x-1/2
                    w-20 h-[2px]
                    bg-gradient-to-r
                    from-transparent
                    via-orange-300/60
                    to-transparent
                "></div>

            </div>

        </div>

        <!-- Layout Principale a due colonne -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- COLONNA SINISTRA: Mappa + Wallet (Unificati in una sola Card Glass) -->
            <div class="lg:col-span-5 h-fit">
                <div class="bg-white/80 backdrop-blur-md rounded-[2.5rem] shadow-xl border border-white/60 p-6 flex flex-col gap-6">
                    
                    <!-- Sezione Mappa -->
                    <div class="flex flex-col h-[350px]">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center text-teal-600 border border-teal-100 shadow-sm">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                            </div>
                            <div>
                                <h2 class="text-sm font-black text-gray-900 uppercase tracking-widest">Mappa Attiva</h2>
                                <p class="text-[10px] text-gray-500 font-medium mt-0.5">Sincronizzata con l'area</p>
                            </div>
                        </div>
                        <div id="map" class="w-full flex-grow rounded-2xl shadow-inner border border-gray-200/80 z-10"></div>
                    </div>

                    <hr class="border-gray-200/60">

                    <!-- Sezione Wallet -->
                    <div id="wallet-container">
                        <!-- Iniettato da JS -->
                    </div>

                </div>
            </div>

            <!-- COLONNA DESTRA: Itinerario e Logistica -->
            <div class="lg:col-span-7 bg-white/90 backdrop-blur-sm rounded-[2.5rem] shadow-xl overflow-hidden border border-white/60 flex flex-col justify-between">
                <div id="content-container">
                    <!-- Il contenuto verrà generato dal JS -->
                </div>
                <div class="px-8 py-5 bg-white/50 border-t border-gray-100/60 flex justify-between items-center text-xs text-gray-500 mt-auto">
                    <span id="footer-trip-name"></span>
                    <span id="footer-trip-season" class="font-bold text-amber-600"></span>
                </div>
            </div>

        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

    <!-- Modale Voli -->
    <div id="flight-modal-container"></div>
</body>
</html>
