<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-amber-50 to-emerald-50 min-h-screen text-gray-800 font-sans p-4 sm:p-6 relative overflow-x-hidden">

    <!-- CANVAS PER I FIORI (Fisso sullo sfondo, trasparente ai click) -->
    <canvas id="cempasuchil-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0 opacity-60"></canvas>

    <!-- Tutto il contenuto deve stare *sopra* il canvas, quindi diamo z-10 al wrapper -->
    <div class="max-w-7xl mx-auto relative z-10">
        <!-- Header Dinamico -->
        <header class="text-center mb-6">
            <span id="trip-dates" class="bg-amber-200 text-amber-900 text-xs font-bold uppercase px-3 py-1 rounded-full tracking-wider"></span>
            <h1 id="trip-title" class="text-3xl sm:text-4xl font-extrabold text-emerald-900 mt-2"></h1>
            <p id="trip-subtitle" class="text-gray-600 mt-1"></p>
            <!-- Pulsante Voli -->
            <div class="mt-5 flex justify-center">
                <button onclick="toggleFlightModal()" class="inline-flex items-center gap-2 px-6 py-2.5 bg-slate-900 text-white text-sm font-extrabold rounded-full shadow-xl hover:bg-slate-800 transition-all hover:-translate-y-0.5 hover:shadow-slate-400/50">
                    ✈️ Dettagli Voli
                </button>
            </div>
        </header>

        <!-- Navigazione Dinamica -->
        <div id="nav-container" class="grid grid-cols-2 lg:grid-cols-5 gap-2 mb-6">
            <!-- I bottoni verranno generati dal JS -->
        </div>

        <!-- IMMAGINE PANORAMICA (HERO HEADER) -->
        <div class="mb-6 relative w-full group">
            <!-- Altezza ridotta per non rubare troppo spazio -->
            <img id="dynamic-area-image" src="https://images.unsplash.com/photo-1518105779142-d975f22f1b0a?auto=format&fit=crop&w=1200&q=80" alt="Scorcio Messico" class="w-full h-[200px] lg:h-[280px] object-cover rounded-[2rem] shadow-md border border-gray-100 transition-opacity duration-500">
            
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent rounded-[2rem] flex flex-col justify-end p-6 sm:p-10 pointer-events-none">
                <div id="dynamic-area-text" class="transition-opacity duration-500">
                    <!-- Titolo, Badge e Descrizione iniettati dal JS -->
                </div>
            </div>
        </div>

        <!-- Layout Principale a due colonne -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- COLONNA SINISTRA: Mappa + Wallet -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                
                <!-- Box Mappa -->
                <div class="bg-white p-5 sm:p-6 rounded-[2rem] shadow-sm border border-gray-100 flex flex-col h-[400px]">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600 border border-emerald-100">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                            </div>
                            <div>
                                <h2 class="text-sm font-black text-gray-900 uppercase tracking-widest">Mappa</h2>
                                <p class="text-[10px] text-gray-500 font-medium mt-0.5">Sincronizzata con l'area</p>
                            </div>
                        </div>
                    </div>
                    <div id="map" class="w-full flex-grow rounded-xl shadow-inner border border-gray-200 z-10"></div>
                </div>

                <!-- Contenitore Wallet Dinamico (Generato dal JS) -->
                <div id="wallet-container"></div>
                
            </div>

            <!-- COLONNA DESTRA: Contenuti Dinamici -->
            <div class="lg:col-span-7 bg-white rounded-[2rem] shadow-xl overflow-hidden border border-gray-100 flex flex-col justify-between">
                
                <div id="content-container">
                    <!-- Il contenuto verrà generato dal JS -->
                </div>

                <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-between items-center text-xs text-gray-500 mt-auto">
                    <span id="footer-trip-name"></span>
                    <span id="footer-trip-season" class="font-bold text-emerald-700"></span>
                </div>
            </div>

        </div>
    </div>

    <!-- Dati e Logica -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

    <!-- Contenitore Modale Voli (Dinamico) -->
    <div id="flight-modal-container"></div>
</body>
</html>
