<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messico · Dettaglio giornata</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css?v=20261016-design-phase2-1">
    <!-- Leaflet CSS & JS per la Mappa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
        /* Stile specifico per la mappa del dettaglio */
        #map-detail { height: 310px; width: 100%; border-radius: 1rem; z-index: 10; }
        @media (max-width: 640px) { #map-detail { height: 250px; } }
    </style>
</head>
<body class="trip-day-page font-sans p-3 sm:p-8">

    <main class="trip-day-shell max-w-4xl mx-auto bg-white rounded-[1.75rem] shadow-lg overflow-hidden border border-amber-100">
        <!-- Bottone Indietro -->
        <div class="trip-day-topbar p-4 sm:px-8 border-b border-amber-100 bg-amber-50/60">
            <a href="index.html" class="text-emerald-700 text-sm font-bold hover:underline flex items-center gap-1">
                <span>←</span> Torna all'Itinerario
            </a>
        </div>

        <div class="trip-day-content p-5 sm:p-9" id="day-content">
            <!-- Contenuto in attesa di JS -->
            <p class="text-gray-500">Caricamento dettagli...</p>
        </div>
    </main>

    <!-- Dati e Logica -->
    <script src="js/data.js?v=20261016-phase3-media-1"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dayId = urlParams.get('day');

        let selectedDay = null;
        tripData.areas.forEach(area => {
            if (area.days) {
                const found = area.days.find(d => d.id === dayId);
                if (found) selectedDay = found;
            }
        });

        if (selectedDay) {
            const container = document.getElementById('day-content');
            
            // Foto verificate della tappa con attribuzioni Wikimedia Commons.
            // L'immagine non implica che un'attività opzionale sia stata prenotata.
            const imagesHtml = (selectedDay.images || []).map((img, i) => {
                const credit = (selectedDay.imageCredits || [])[i];
                return `<figure class="mb-5">
                    <img src="${img}" alt="${credit?.caption || 'Fotografia rappresentativa di ' + selectedDay.location}" loading="lazy" decoding="async" width="960" height="630" class="w-full h-48 sm:h-64 object-cover rounded-xl bg-amber-50">
                    ${credit ? `<figcaption class="pt-2 text-xs text-gray-500 leading-relaxed">${credit.caption} · Foto: <a href="${credit.url}" target="_blank" rel="noopener noreferrer" class="underline hover:text-emerald-800">${credit.author} · ${credit.license} · Wikimedia Commons</a>. Foto d'archivio: non ritrae necessariamente il giorno del viaggio.</figcaption>` : ''}
                </figure>`;
            }).join('');

            // Genera Link
            const linksHtml = (selectedDay.links || []).map(link => 
                `<a href="${link.url}" target="_blank" rel="noopener noreferrer" class="inline-block bg-emerald-100 text-emerald-800 px-4 py-2 rounded-lg text-sm font-bold hover:bg-emerald-200 transition mb-2 mr-2">${link.text}</a>`
            ).join('');

            // Struttura Base HTML
            container.innerHTML = `
                <div class="flex items-center gap-3 mb-4">
                    <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full uppercase">${selectedDay.dayName}</span>
                    <span class="text-gray-400 text-sm font-medium">📍 ${selectedDay.location}</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-emerald-950 leading-tight mb-6">${selectedDay.title}</h1>
                
                ${imagesHtml}

                <h2 class="text-lg sm:text-xl font-extrabold text-emerald-950 mt-6 mb-3">Programma della giornata</h2>
                <div class="trip-day-prose text-gray-700 leading-relaxed mb-8 space-y-4">${selectedDay.fullDesc}</div>

                ${(selectedDay.operationalNotes || []).length ? `
                    <section class="mb-8 border-l-4 border-amber-400 rounded-r-xl bg-amber-50 p-4 sm:p-5">
                        <h3 class="text-sm font-extrabold text-amber-950 mb-2">📌 Verifiche e informazioni pratiche</h3>
                        <ul class="space-y-2 text-sm leading-relaxed text-amber-950">
                            ${selectedDay.operationalNotes.map(note => `<li class="flex items-start gap-2"><span aria-hidden="true">•</span><span>${note}</span></li>`).join('')}
                        </ul>
                    </section>
                ` : ''}
                
                <!-- MAPPA: marcatori orientativi, nessun percorso stradale fittizio -->
                ${(selectedDay.route || []).length ? `
                    <section class="mb-8">
                        <h2 class="text-lg sm:text-xl font-extrabold text-emerald-950 mb-2">Luoghi sulla mappa</h2>
                        <p class="text-xs text-gray-500 mb-3 leading-relaxed">${selectedDay.routeNote || 'I segnaposto indicano i luoghi in ordine di visita, non un tragitto stradale verificato.'} Per navigare sul posto usare un navigatore aggiornato.</p>
                        <div id="map-detail" class="border border-gray-200 shadow-inner" role="region" aria-label="Mappa dei luoghi della giornata"></div>
                    </section>`
                    : `<p class="text-xs text-gray-500 my-5">Giornata di trasferimento senza tappe mappabili con precisione: consulta i collegamenti e gli operatori indicati.</p>`}
                
                ${linksHtml ? `<h2 class="text-lg sm:text-xl font-extrabold text-emerald-950 mb-3">Risorse utili</h2>
                <div class="flex flex-wrap">${linksHtml}</div>` : ''}
            `;

            // INIZIALIZZAZIONE MAPPA DETTAGLIO
            if (selectedDay.route && selectedDay.route.length > 0) {
                const mapDetail = L.map('map-detail');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 18,
                    attribution: '&copy; OpenStreetMap'
                }).addTo(mapDetail);

                const latlngs = [];
                
                // Crea i pin con le immagini
                selectedDay.route.forEach((stop, index) => {
                    const marker = L.marker(stop.coords).addTo(mapDetail);
                    
                    let popupContent = `<div class="text-center font-sans">`;
                    popupContent += `<b class="block text-emerald-800 mb-1 text-sm">${index + 1}. ${stop.name}</b>`;
                    
                    if (stop.image) {
                        // MODIFICA 1: Cambiato h-24 (96px) in h-40 (160px) per aumentare l'altezza
                        popupContent += `<img src="${stop.image}" alt="${stop.name}" class="w-full h-40 object-cover rounded mt-2 shadow-md">`;
                    }
                    
                    popupContent += `</div>`;

                    // MODIFICA 2: Aumentato il minWidth da 160 a 240 per rendere il fumetto più largo
                    marker.bindPopup(popupContent, { minWidth: 240 });
                    latlngs.push(stop.coords);
                });

                // Solo punti reali/contenuti nel programma, non linee che sembrano percorsi verificati.
                // Centra la mappa sui luoghi selezionati.
                if (latlngs.length === 1) mapDetail.setView(latlngs[0], 12);
                else mapDetail.fitBounds(L.latLngBounds(latlngs), {padding: [30, 30]});
            }
        }
    </script>
</body>
</html>
